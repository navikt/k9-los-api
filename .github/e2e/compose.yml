name: los-e2e
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: k9los_unit
      POSTGRES_USER: k9los_unit
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?}
    ports:
      - '127.0.0.1:${E2E_DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U k9los_unit -d k9los_unit']
      interval: 2s
      timeout: 5s
      retries: 30
  azure-mock:
    image: ghcr.io/navikt/azure-mock@sha256:95efddb105acc8f78f3f17606d53c0cde16858715122daae98f601649a0b505e
    platform: linux/amd64
    ports:
      - '127.0.0.1:${E2E_AZURE_PORT:-8100}:8100'
  kafka:
    image: apache/kafka:4.1.1
    ports:
      - '127.0.0.1:${E2E_KAFKA_PORT:-9093}:9093'
    volumes:
      - '${E2E_CERT_DIR:?}:/etc/kafka/secrets:ro'
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_LISTENERS: SSL://:9093,INTERNAL://:9092,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: SSL://localhost:${E2E_KAFKA_PORT:-9093},INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SSL:SSL,INTERNAL:SSL,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SSL_KEYSTORE_FILENAME: keystore.p12
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_CREDENTIALS: password
      KAFKA_SSL_KEY_CREDENTIALS: password
      KAFKA_SSL_TRUSTSTORE_FILENAME: truststore.jks
      KAFKA_SSL_TRUSTSTORE_TYPE: JKS
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: password
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --command-config /etc/kafka/secrets/client.properties --list']
      interval: 5s
      timeout: 30s
      start_period: 30s
      retries: 30
