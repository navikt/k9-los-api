name: los-e2e
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: k9los_unit
      POSTGRES_USER: k9los_unit
      POSTGRES_PASSWORD: k9los_unit
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U k9los_unit -d k9los_unit']
      interval: 2s
      timeout: 5s
      retries: 30
  azure-mock:
    image: ghcr.io/navikt/azure-mock:latest
    platform: linux/amd64
    ports:
      - '127.0.0.1:8100:8100'
