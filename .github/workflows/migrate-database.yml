name: Migrer database

on:
  workflow_dispatch:
    inputs:
      image:
        required: true
        type: string
        description: Image-taggen som inneholder migreringene
      environment:
        required: true
        type: choice
        description: Miljøet som skal migreres
        options:
          - dev
          - prod

jobs:
  migrate:
    name: Migrer ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: ${{ inputs.environment }}-fss:k9saksbehandling
    concurrency:
      group: k9-los-api-database-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Logg inn i GAR
        id: login
        uses: nais/login@bb6c3e1e14e53d40d69d0d092bd2fce2e39ae3bf # v0
        with:
          team: k9saksbehandling
      - name: Kjør Flyway
        uses: nais/deploy/actions/deploy@fc3eae3edebabdf67f7592102ae16176d5ba3b5f # v2
        env:
          CLUSTER: ${{ inputs.environment }}-fss
          RESOURCE: nais/db-migration.yml
          VARS: nais/${{ inputs.environment }}-fss.json
          VAR: migration_command=migrate
          IMAGE: ${{ steps.login.outputs.registry }}/${{ github.repository }}:${{ inputs.image }}
          TIMEOUT: 355m
