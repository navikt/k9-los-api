name: "Bygg og deploy"
on:
  push:
    paths-ignore:
      - '**.md'
      - '**.MD'
      - '.gitignore'
      - 'LICENSE'
      - 'CODEOWNERS'
  workflow_dispatch:

jobs:

  build-app:
    name: Build and test (including docker image)
    permissions:
      contents: read
      packages: write
      id-token: write
    #TODO kan fjerne testcontainers og bruke maven-build-app-db til å sette opp database for tester her
    uses: navikt/sif-gha-workflows/.github/workflows/maven-build-app.yml@main
    with:
      runs-on: ${{ case(github.ref_name == github.event.repository.default_branch, 'ubuntu-latest-8-cores', 'ubuntu-latest-4-cores') }}
      java-version: 25
      build-image: ${{ github.ref_name == github.event.repository.default_branch}}
      push-image: ${{ github.ref_name == github.event.repository.default_branch}}
      upload-image: ${{ github.ref_name != github.event.repository.default_branch }}
      t-2c: "-T1C"
    secrets: inherit

  deploy-dev:
    name: Migrer og deploy dev
    runs-on: ubuntu-latest
    timeout-minutes: 370
    environment: dev-fss:k9saksbehandling
    permissions:
      contents: read
      id-token: write
    if: ${{ github.ref_name == github.event.repository.default_branch}}
    needs: [ build-app ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Logg inn i GAR
        id: login
        uses: nais/login@bb6c3e1e14e53d40d69d0d092bd2fce2e39ae3bf # v0
        with:
          team: k9saksbehandling
      - name: Kjør Flyway
        uses: nais/deploy/actions/deploy@fc3eae3edebabdf67f7592102ae16176d5ba3b5f # v2
        env:
          CLUSTER: dev-fss
          RESOURCE: nais/db-migration.yml
          VARS: nais/dev-fss.json
          IMAGE: ${{ steps.login.outputs.registry }}/${{ github.repository }}:${{ needs.build-app.outputs.build-version }}
          TIMEOUT: 355m
      - name: Deploy applikasjon
        uses: nais/deploy/actions/deploy@fc3eae3edebabdf67f7592102ae16176d5ba3b5f # v2
        env:
          CLUSTER: dev-fss
          RESOURCE: nais/naiserator.yml
          VARS: nais/dev-fss.json
          IMAGE: ${{ steps.login.outputs.registry }}/${{ github.repository }}:${{ needs.build-app.outputs.build-version }}
          TIMEOUT: 10m

  deploy-prod:
    name: Migrer og deploy prod
    runs-on: ubuntu-latest
    timeout-minutes: 370
    environment: prod-fss:k9saksbehandling
    permissions:
      contents: read
      id-token: write
    if: ${{ github.ref_name == github.event.repository.default_branch}}
    needs: [ build-app ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Logg inn i GAR
        id: login
        uses: nais/login@bb6c3e1e14e53d40d69d0d092bd2fce2e39ae3bf # v0
        with:
          team: k9saksbehandling
      - name: Kjør Flyway
        uses: nais/deploy/actions/deploy@fc3eae3edebabdf67f7592102ae16176d5ba3b5f # v2
        env:
          CLUSTER: prod-fss
          RESOURCE: nais/db-migration.yml
          VARS: nais/prod-fss.json
          IMAGE: ${{ steps.login.outputs.registry }}/${{ github.repository }}:${{ needs.build-app.outputs.build-version }}
          TIMEOUT: 355m
      - name: Deploy applikasjon
        uses: nais/deploy/actions/deploy@fc3eae3edebabdf67f7592102ae16176d5ba3b5f # v2
        env:
          CLUSTER: prod-fss
          RESOURCE: nais/naiserator.yml
          VARS: nais/prod-fss.json
          IMAGE: ${{ steps.login.outputs.registry }}/${{ github.repository }}:${{ needs.build-app.outputs.build-version }}
          TIMEOUT: 10m
