name: "Bygg og deploy"
concurrency:
  group: k9-los-api-${{ github.ref }}
  cancel-in-progress: false
on:
  push:
    paths-ignore:
      - '**.md'
      - '**.MD'
      - '.gitignore'
      - 'LICENSE'
      - 'CODEOWNERS'
  workflow_dispatch:

jobs:

  build-app:
    name: Build and test (including docker image)
    permissions:
      contents: read
      packages: write
      id-token: write
    #TODO kan fjerne testcontainers og bruke maven-build-app-db til å sette opp database for tester her
    uses: navikt/sif-gha-workflows/.github/workflows/maven-build-app.yml@6210f854877aa6ebf70ee26bcc90bcabf8db3420 # Pinned bygg-workflow
    with:
      runs-on: ${{ github.ref_name == github.event.repository.default_branch && 'ubuntu-latest-8-cores' || 'ubuntu-latest-4-cores' }}
      java-version: '25'
      build-image: true
      push-image: ${{ github.ref_name == github.event.repository.default_branch}}
      upload-image: ${{ github.ref_name != github.event.repository.default_branch }}
      t-2c: "-T1C"
    secrets: inherit

  verdikjede-los-api:
    name: LOS API-verdikjede
    needs: [build-app]
    permissions:
      id-token: write
      contents: read
      packages: read
    uses: navikt/sif-gha-workflows/.github/workflows/verdikjede-test-v2.yml@6210f854877aa6ebf70ee26bcc90bcabf8db3420 # LOS API-suite og image-verifisering
    with:
      suites: los-api
      tag: ${{ needs.build-app.outputs.build-version }}
      image_version: ${{ needs.build-app.outputs.build-version }}
      override_image_artifact_name: ${{ needs.build-app.outputs.image-artifact-name }}
      k9-verdikjede-sha: 5faeab2d72eda43355a1d5e53eb0cd74b3d33eb1
    secrets: inherit

  los-web-kompatibilitet:
    name: Kompatibilitet med eksisterende LOS-web
    needs: [build-app]
    permissions:
      contents: read
      packages: read
    uses: navikt/k9-los-web/.github/workflows/los-e2e.yml@bcac489f5dbfa7a603839b2ff696f7bd2c58eedb # Avgrenset LOS-stack, ikke verdikjeden
    with:
      api_ref: ${{ github.sha }}
      web_ref: bcac489f5dbfa7a603839b2ff696f7bd2c58eedb
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}

  deploy-dev:
    name: Deploy dev
    permissions:
      id-token: write
      contents: write
    if: ${{ github.ref_name == github.event.repository.default_branch}}
    needs: [ build-app ]
    uses: navikt/sif-gha-workflows/.github/workflows/maven-deploy.yml@6210f854877aa6ebf70ee26bcc90bcabf8db3420 # Pinned deploy-workflow
    with:
      gar: true
      image: ${{ needs.build-app.outputs.build-version }}
      cluster: dev-fss
      naiserator_file: nais/naiserator.yml
      input_vars_file: nais/dev-fss.json
    secrets: inherit

  deploy-prod:
    name: Deploy prod
    permissions:
      id-token: write
      contents: write
    if: ${{ github.ref_name == github.event.repository.default_branch}}
    needs: [build-app, verdikjede-los-api, los-web-kompatibilitet]
    uses: navikt/sif-gha-workflows/.github/workflows/maven-deploy.yml@6210f854877aa6ebf70ee26bcc90bcabf8db3420 # Pinned deploy-workflow
    with:
      gar: true
      image: ${{ needs.build-app.outputs.build-version }}
      cluster: prod-fss
      naiserator_file: nais/naiserator.yml
      input_vars_file: nais/prod-fss.json
    secrets: inherit
